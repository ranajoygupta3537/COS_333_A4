<!DOCTYPE html>
<html>
   <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <style>
         .header, .footer {background-color:#295078; color:white}
         .footerlink {color: white;}
      </style>
      <title>Registrar's Office Class Search</title>
   </head>
   <body>
      <div class="modal" id="detailsModal">
         <div class="modal-dialog">
            <div class="modal-content">
               <div class="modal-header">
                  <h4 class="modal-title">Registrar's Office Class Details</h4>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
               </div>
               <div class="modal-body" id="modalBody">
                 Modal body; to be replaced.
               </div>
               <div class="modal-footer">
                  <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
               </div>
            </div>
         </div>
      </div>
      
      <div class="container-fluid header sticky-top">
         <center>
            <h1>Registrar's Office Class Search</h1>
         </center>
         <div class="row">
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Department" id="dept" autofocus>
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Number" id="coursenum">
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Area" id="area">
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Title" id="title">
            </div>
         </div>
         <br>
      </div>
      
      <div class="container-fluid" id="resultsDiv"></div>
      
      <div class="container-fluid footer sticky-bottom">
         <center>
            Created by Ranajoy Gupta
         </center>
      </div>
      
      <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
      <script>
         'use strict';
         
         let overviewsTemplate = `
            <table class="table table-striped" id="overviewsTable" rand="{{rand}}">
               <thead>
                  <tr>
                     <th>ClassId</th>
                     <th>Dept</th>
                     <th>Num</th>
                     <th>Area</th>
                     <th>Title</th>
                  </tr>
               </thead>
               <tbody>
                  {{#classes}}
                     <tr>
                        <td>
                           <button onclick="getDetails({{classid}})">{{classid}}</button>
                        </td>
                        <td>{{dept}}</td>
                        <td>{{coursenum}}</td>
                        <td>{{area}}</td>
                        <td>{{title}}</td>
                     </tr>
                  {{/classes}}
               </tbody>
            </table>
         `;
         
         let detailsTemplate = `
            <p><strong>Class Id: </strong>{{classid}}</p>
            <p><strong>Days: </strong>{{days}}</p>
            <p><strong>Start Time: </strong>{{starttime}}</p>
            <p><strong>End Time: </strong>{{endtime}}</p>
            <p><strong>Building: </strong>{{bldg}}</p>
            <p><strong>Room: </strong>{{roomnum}}</p>
            <hr>
            <p><strong>Course Id: </strong>{{courseid}}</p>
            <p><strong>Departments and Numbers: </strong>{{deptcoursenums}}</p>
            <p><strong>Area: </strong>{{area}}</p>
            <p><strong>Title: </strong>{{title}}</p>
            <p><strong>Description: </strong>{{descrip}}</p>
            <p><strong>Prerequisites: </strong>{{prereqs}}</p>
            <p><strong>Professors: </strong>{{profnames}}</p>
         `;
         
         let overviewsController = null;
         
         async function fetchOverviews() {
            let dept = document.getElementById('dept').value;
            let coursenum = document.getElementById('coursenum').value;
            let area = document.getElementById('area').value;
            let title = document.getElementById('title').value;
            
            let url = '/regoverviews?dept=' + encodeURIComponent(dept) + 
                      '&coursenum=' + encodeURIComponent(coursenum) + 
                      '&area=' + encodeURIComponent(area) + 
                      '&title=' + encodeURIComponent(title);
                      
            if (overviewsController !== null) {
               overviewsController.abort();
            }
            overviewsController = new AbortController();
            
            try {
               let response = await fetch(url, { signal: overviewsController.signal });
               if (!response.ok) throw new Error();
               
               let data = await response.json();
               if (!data[0]) {
                  alert(data[1]);
                  return;
               }
               
               let map = {
                  classes: data[1],
                  rand: String(Math.random())
               };
               let html = Mustache.render(overviewsTemplate, map);
               document.getElementById('resultsDiv').innerHTML = html;
            } catch (err) {
               if (err.name !== 'AbortError') {
                  alert('Error: Failed to fetch data from server');
               }
            }
         }
         
         let timer = null;
         function debouncedFetchOverviews() {
            clearTimeout(timer);
            timer = setTimeout(fetchOverviews, 500);
         }
         
         let detailsController = null;
         
         async function getDetails(classid) {
            let url = '/regdetails?classid=' + encodeURIComponent(classid);
            
            if (detailsController !== null) {
               detailsController.abort();
            }
            detailsController = new AbortController();
            
            try {
               let response = await fetch(url, { signal: detailsController.signal });
               if (!response.ok) throw new Error();
               
               let data = await response.json();
               if (!data[0]) {
                  alert(data[1]);
                  return;
               }
               
               let details = data[1];
               details.deptcoursenums = details.deptcoursenums.join(', ');
               details.profnames = details.profnames.join(', ');
               
               let html = Mustache.render(detailsTemplate, details);
               document.getElementById('modalBody').innerHTML = html;
               
               let modalNode = document.getElementById('detailsModal');
               let detailsModal = new bootstrap.Modal(modalNode);
               detailsModal.show();
            } catch (err) {
               if (err.name !== 'AbortError') {
                  alert('Error: Failed to fetch data from server');
               }
            }
         }
         
         function setup() {
            document.getElementById('dept').addEventListener('input', debouncedFetchOverviews);
            document.getElementById('coursenum').addEventListener('input', debouncedFetchOverviews);
            document.getElementById('area').addEventListener('input', debouncedFetchOverviews);
            document.getElementById('title').addEventListener('input', debouncedFetchOverviews);
            
            fetchOverviews();
         }
         
         document.addEventListener('DOMContentLoaded', setup);
      </script>
   </body>
</html>
