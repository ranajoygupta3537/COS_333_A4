<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar's Office Class Search</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header, .footer {
            background-color: #295078;
            color: white;
            text-align: center;
        }
        .header {
            padding: 10px 0;
            margin-bottom: 20px;
        }
        .footer {
            padding: 5px 0;
        }
        .header a, .footer a {
            color: white;
            text-decoration: underline;
        }
        
        .form-control {
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid sticky-top header shadow-sm">
        <center>
            <h2 class="d-none d-sm-block" style="font-size: 2.5rem; margin: 0; padding-bottom: 5px;">Registrar's Office Class Search</h2>
            <h3 class="d-block d-sm-none m-0">Registrar's Office Class Search</h3>
        </center>
        
        <div class="container-fluid px-3">
            <div class="row">
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="dept" placeholder="Department" autofocus>
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="coursenum" placeholder="Number">
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="area" placeholder="Area">
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="title" placeholder="Title">
                </div>
            </div>
        </div>
    </div>

    <main class="container-fluid flex-grow-1 px-3">
        <div class="table-responsive">
            <table class="table table-striped" id="overviewsTable" rand="0">
                <thead>
                    <tr>
                        <th style="width: 80px;">ClassId</th>
                        <th style="width: 80px;">Dept</th>
                        <th style="width: 80px;">Num</th>
                        <th style="width: 80px;">Area</th>
                        <th>Title</th>
                    </tr>
                </thead>
                <tbody id="overviewsTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <div class="container-fluid sticky-bottom footer mt-auto shadow-sm">
        <center>
            Created by Ranajoy Gupta
        </center>
    </div>

    <div class="modal" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailsModalLabel">Class Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>

    <script>
        'use strict';

        let overviewsController = null;
        let overviewsTimer = null;
        let detailsController = null;

        async function getOverviews() {
            const dept = document.getElementById('dept').value;
            const coursenum = document.getElementById('coursenum').value;
            const area = document.getElementById('area').value;
            const title = document.getElementById('title').value;

            const url = '/regoverviews?dept=' + encodeURIComponent(dept) +
                        '&coursenum=' + encodeURIComponent(coursenum) +
                        '&area=' + encodeURIComponent(area) +
                        '&title=' + encodeURIComponent(title);

            if (overviewsController !== null) {
                overviewsController.abort();
            }
            overviewsController = new AbortController();

            try {
                const response = await fetch(url, { signal: overviewsController.signal });
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                if (data[0] === true) {
                    renderTable(data[1]);
                } else {
                    alert('Server error: ' + data[1]);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('Error: Failed to fetch data from server');
                }
            }
        }

        function debouncedGetOverviews() {
            clearTimeout(overviewsTimer);
            overviewsTimer = setTimeout(getOverviews, 500);
        }

        function renderTable(classes) {
            const template = `
                {{#classes}}
                <tr>
                    <td><button onclick="getDetails({{classid}})" class="btn btn-sm btn-outline-secondary px-2 py-0 text-dark" style="border-color: #ced4da;">{{classid}}</button></td>
                    <td>{{dept}}</td>
                    <td>{{coursenum}}</td>
                    <td>{{area}}</td>
                    <td>{{title}}</td>
                </tr>
                {{/classes}}
            `;
            
            const map = { classes: classes };
            const html = Mustache.render(template, map);
            
            document.getElementById('overviewsTableBody').innerHTML = html;
            document.getElementById('overviewsTable').setAttribute('rand', Math.random());
        }

        async function getDetails(classid) {
            const url = '/regdetails?classid=' + encodeURIComponent(classid);

            if (detailsController !== null) {
                detailsController.abort();
            }
            detailsController = new AbortController();

            try {
                const response = await fetch(url, { signal: detailsController.signal });
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                if (data[0] === true) {
                    renderModal(data[1]);
                } else {
                    alert('Server error: ' + data[1]);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('Error: Failed to fetch data from server');
                }
            }
        }

        function renderModal(details) {
            details.joinedDeptCoursenums = details.deptcoursenums.join(', ');
            details.joinedProfnames = details.profnames.join(', ');

            const template = `
                <p><strong>Class Id:</strong> {{classid}}</p>
                <p><strong>Days:</strong> {{days}}</p>
                <p><strong>Start Time:</strong> {{starttime}}</p>
                <p><strong>End Time:</strong> {{endtime}}</p>
                <p><strong>Building:</strong> {{bldg}}</p>
                <p><strong>Room:</strong> {{roomnum}}</p>
                <hr>
                <p><strong>Course Id:</strong> {{courseid}}</p>
                <p><strong>Departments and Numbers:</strong> {{joinedDeptCoursenums}}</p>
                <p><strong>Area:</strong> {{area}}</p>
                <p><strong>Title:</strong> {{title}}</p>
                <p><strong>Description:</strong> {{descrip}}</p>
                <p><strong>Prerequisites:</strong> {{prereqs}}</p>
                <p><strong>Professors:</strong> {{joinedProfnames}}</p>
            `;
            
            const html = Mustache.render(template, details);
            document.getElementById('modalBody').innerHTML = html;
            
            const modalElement = document.getElementById('detailsModal');
            let booksModal = bootstrap.Modal.getInstance(modalElement);
            if (!booksModal) {
                booksModal = new bootstrap.Modal(modalElement);
            }
            booksModal.show();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputs = ['dept', 'coursenum', 'area', 'title'];
            for (let id of inputs) {
                document.getElementById(id).addEventListener('input', debouncedGetOverviews);
            }
            getOverviews();
        });

    </script>
</body>
</html>
