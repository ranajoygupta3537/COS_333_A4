<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar's Office Class Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-a4 {
            background-color: #295078;
            color: white;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="modal" id="detailsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Registrar's Office Class Details</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <header class="container-fluid sticky-top bg-a4 pt-3 pb-3 shadow-sm">
        <h1 class="text-center mb-3">Registrar's Office Class Search</h1>
        <div class="row px-2">
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input class="form-control" type="text" placeholder="Department" id="dept" autofocus>
            </div>
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input class="form-control" type="text" placeholder="Number" id="coursenum">
            </div>
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input class="form-control" type="text" placeholder="Area" id="area">
            </div>
            <div class="col-sm-3">
                <input class="form-control" type="text" placeholder="Title" id="title">
            </div>
        </div>
    </header>

    <main class="container-fluid flex-grow-1 mt-2" id="resultsDiv">
    </main>

    <footer class="container-fluid sticky-bottom bg-a4 py-2 text-center shadow-sm">
        Created by Ranajoy Gupta
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
    <script>
        'use strict';

        const overviewsTpl = `
            <table class="table table-striped" id="overviewsTable" rand="{{rand}}">
                <thead>
                    <tr>
                        <th>ClassId</th>
                        <th>Dept</th>
                        <th>Num</th>
                        <th>Area</th>
                        <th>Title</th>
                    </tr>
                </thead>
                <tbody>
                    {{#classes}}
                    <tr>
                        <td>
                            <button onclick="fetchDetails({{classid}})">{{classid}}</button>
                        </td>
                        <td>{{dept}}</td>
                        <td>{{coursenum}}</td>
                        <td>{{area}}</td>
                        <td>{{title}}</td>
                    </tr>
                    {{/classes}}
                </tbody>
            </table>
        `;

        const detailsTpl = `
            <p><strong>Class Id: </strong>{{classid}}</p>
            <p><strong>Days: </strong>{{days}}</p>
            <p><strong>Start Time: </strong>{{starttime}}</p>
            <p><strong>End Time: </strong>{{endtime}}</p>
            <p><strong>Building: </strong>{{bldg}}</p>
            <p><strong>Room: </strong>{{roomnum}}</p>
            <hr>
            <p><strong>Course Id: </strong>{{courseid}}</p>
            <p><strong>Departments and Numbers: </strong>{{deptcoursenums}}</p>
            <p><strong>Area: </strong>{{area}}</p>
            <p><strong>Title: </strong>{{title}}</p>
            <p><strong>Description: </strong>{{descrip}}</p>
            <p><strong>Prerequisites: </strong>{{prereqs}}</p>
            <p><strong>Professors: </strong>{{profnames}}</p>
        `;

        let overviewsAbort = null;
        let detailsAbort = null;
        let debounceTimer = null;

        async function handleOverviews() {
            const dept = encodeURIComponent(document.getElementById('dept').value);
            const coursenum = encodeURIComponent(document.getElementById('coursenum').value);
            const area = encodeURIComponent(document.getElementById('area').value);
            const title = encodeURIComponent(document.getElementById('title').value);
            
            const url = '/regoverviews?dept=' + dept + '&coursenum=' + coursenum + '&area=' + area + '&title=' + title;

            if (overviewsAbort) {
                overviewsAbort.abort();
            }
            overviewsAbort = new AbortController();

            try {
                const response = await fetch(url, { signal: overviewsAbort.signal });
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                if (!data[0]) {
                    alert(data[1]);
                    return;
                }
                
                const html = Mustache.render(overviewsTpl, {
                    classes: data[1],
                    rand: Math.random().toString()
                });
                document.getElementById('resultsDiv').innerHTML = html;
            } catch (error) {
                if (error.name !== 'AbortError') {
                    alert('Error: Failed to fetch data from server');
                }
            }
        }

        async function fetchDetails(classid) {
            const url = '/regdetails?classid=' + encodeURIComponent(classid);

            if (detailsAbort) {
                detailsAbort.abort();
            }
            detailsAbort = new AbortController();

            try {
                const response = await fetch(url, { signal: detailsAbort.signal });
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                if (!data[0]) {
                    alert(data[1]);
                    return;
                }
                
                const details = data[1];
                details.deptcoursenums = details.deptcoursenums.join(', ');
                details.profnames = details.profnames.join(', ');
                
                const html = Mustache.render(detailsTpl, details);
                document.getElementById('modalBody').innerHTML = html;
                
                const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
                modal.show();
            } catch (error) {
                if (error.name !== 'AbortError') {
                    alert('Error: Failed to fetch data from server');
                }
            }
        }

        function onInputTrigger() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(handleOverviews, 500);
        }

        function init() {
            document.getElementById('dept').addEventListener('input', onInputTrigger);
            document.getElementById('coursenum').addEventListener('input', onInputTrigger);
            document.getElementById('area').addEventListener('input', onInputTrigger);
            document.getElementById('title').addEventListener('input', onInputTrigger);
            
            handleOverviews();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
