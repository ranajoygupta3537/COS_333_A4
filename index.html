<!DOCTYPE html>
<html>
   <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <style>
         .header, .footer {background-color:#295078; color:white}
         .footerlink {color: white;}
      </style>
      <title>Registrar's Office Class Search</title>
   </head>
   <body>
      <div class="modal" id="detailsModal">
         <div class="modal-dialog">
            <div class="modal-content">
               <div class="modal-header">
                  <h4 class="modal-title">Registrar's Office Class Details</h4>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
               </div>
               <div class="modal-body" id="modalBody">
                 Modal body; to be replaced.
               </div>
               <div class="modal-footer">
                  <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
               </div>
            </div>
         </div>
      </div>
      <div class="container-fluid header sticky-top">
         <center>
            <h1>Registrar's Office Class Search</h1>
         </center>
         <div class="row">
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Department" name="dept" id="dept" autoFocus>
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Number" name="coursenum" id="coursenum">
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Area" name="area" id="area">
            </div>
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Title" name="title" id="title">
            </div>
         </div>
         <br>
      </div>
      <div class="container-fluid" id="resultsDiv"></div>
      <div class="container-fluid footer sticky-bottom">
         <center>
            Created by Ranajoy Gupta
         </center>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
      <script>
         'use strict';

         let templateOverviews = `
            <table class="table table-striped" id="overviewsTable" rand="{{rand}}">
               <thead>
                  <tr>
                     <td><strong>ClassId</strong></td>
                     <td><strong>Dept</strong></td>
                     <td><strong>Num</strong></td>
                     <td><strong>Area</strong></td>
                     <td><strong>Title</strong></td>
                  </tr>
               </thead>
               <tbody>
                  {{#classes}}
                     <tr>
                        <td>
                           <button onclick="getResultsDetails({{classid}})">
                              {{classid}}
                           </button>
                        </td>
                        <td>{{dept}}</td>
                        <td>{{coursenum}}</td>
                        <td>{{area}}</td>
                        <td>{{title}}</td>
                     </tr>
                  {{/classes}}
               </tbody>
            </table>
         `;
         let requestOverviews = null;
         function getResultsOverviews() {
            function makeOverviews(classes) {
               let map = {classes: classes, rand: String(Math.random())};
               let html = Mustache.render(templateOverviews, map);
               return html;
            }
            function handleResponse() {
               if (this.status !== 200) {
                  alert('Error: Failed to fetch data from server');
                  return;
               }
               let response = JSON.parse(this.response);
               if (! response[0]) {
                  alert(response[1]);
                  return;
               }
               let divNode = document.getElementById('resultsDiv');
               divNode.innerHTML = makeOverviews(response[1]);
            }
            function handleError(request) {
               alert('Error: Failed to fetch data from server');
            }
            let dept = document.getElementById('dept').value;
            let coursenum = document.getElementById('coursenum').value;
            let area = document.getElementById('area').value;
            let title = document.getElementById('title').value;

            dept = encodeURIComponent(dept);
            coursenum = encodeURIComponent(coursenum);
            area = encodeURIComponent(area);
            title = encodeURIComponent(title);

            let url = '/regoverviews' + '?dept=' + dept + '&coursenum=' + coursenum + '&area=' + area + '&title=' + title;

            if (requestOverviews !== null)
               requestOverviews.abort();
            requestOverviews = new XMLHttpRequest();
            requestOverviews.onload = handleResponse;
            requestOverviews.onerror = handleError;
            requestOverviews.open('GET', url);
            requestOverviews.send();
         }
         let timer = null;
         function debouncedGetResultsOverviews() {
            clearTimeout(timer);
            timer = setTimeout(getResultsOverviews, 500);
         }

         let templateDetails = `
            <p><strong>Class Id: </strong>{{details.classid}}</p>
            <p><strong>Days: </strong>{{details.days}}</p>
            <p><strong>Start Time: </strong>{{details.starttime}}</p>
            <p><strong>End Time: </strong>{{details.endtime}}</p>
            <p><strong>Building: </strong>{{details.bldg}}</p>
            <p><strong>Room: </strong>{{details.roomnum}}</p>
            <hr>
            <p><strong>Course Id: </strong>{{details.courseid}}</p>
            <p><strong>Departments and Numbers: </strong>{{details.deptcoursenums}}</p>
            <p><strong>Area: </strong>{{details.area}}</p>
            <p><strong>Title: </strong>{{details.title}}</p>
            <p><strong>Description: </strong>{{details.descrip}}</p>
            <p><strong>Prerequisites: </strong>{{details.prereqs}}</p>
            <p><strong>Professors: </strong>{{details.profnames}}</p>
         `;
         let requestDetails = null;
         function getResultsDetails(classid) {
            function makeDetails(details) {
               details['deptcoursenums'] = details['deptcoursenums'].join(', ');
               details['profnames'] = details['profnames'].join(', ');
               let map = {details: details};
               let html = Mustache.render(templateDetails, map);
               return html;
            }
            function handleResponse() {
               if (this.status !== 200) {
                  alert('Error: Failed to fetch data from server');
                  return;
               }
               let response = JSON.parse(this.response);
               if (! response[0]) {
                  alert(response[1]);
                  return;
               }
               let modalBodyNode = document.getElementById('modalBody');
               modalBodyNode.innerHTML = makeDetails(response[1]);
               let detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));
               detailsModal.show();
            }
            function handleError(request) {
               alert('Error: Failed to fetch data from server');
            }
            let url = '/regdetails?classid=' + String(classid);
            if (requestDetails !== null)
               requestDetails.abort();
            requestDetails = new XMLHttpRequest();
            requestDetails.onload = handleResponse;
            requestDetails.onerror = handleError;
            requestDetails.open('GET', url);
            requestDetails.send();
         }

         function setup() {
            let dept = document.getElementById('dept');
            dept.addEventListener('input', debouncedGetResultsOverviews);
            let coursenum = document.getElementById('coursenum');
            coursenum.addEventListener('input', debouncedGetResultsOverviews);
            let area = document.getElementById('area');
            area.addEventListener('input', debouncedGetResultsOverviews);
            let title = document.getElementById('title');
            title.addEventListener('input', debouncedGetResultsOverviews);
            getResultsOverviews();
         }
         document.addEventListener('DOMContentLoaded', setup);
      </script>
   </body>
</html>
