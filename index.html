<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar's Office Class Search</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-banner {
            background-color: #295078;
            color: white;
            padding: 15px 0;
        }
        .custom-banner a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="container-fluid sticky-top custom-banner mb-3 shadow-sm">
        <div class="text-center mb-3">
            <h1 class="m-0">Registrar's Office Class Search</h1>
        </div>
        
        <div class="row px-2">
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input type="text" class="form-control" id="dept" placeholder="Department" autofocus>
            </div>
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input type="text" class="form-control" id="coursenum" placeholder="Number">
            </div>
            <div class="col-sm-3 mb-2 mb-sm-0">
                <input type="text" class="form-control" id="area" placeholder="Area">
            </div>
            <div class="col-sm-3">
                <input type="text" class="form-control" id="title" placeholder="Title">
            </div>
        </div>
    </header>

    <main class="container-fluid flex-grow-1" id="resultsDiv">
    </main>

    <footer class="container-fluid sticky-bottom custom-banner mt-auto text-center shadow-sm">
        <span>Created by <a href="#">Ranajoy Gupta</a></span>
    </footer>

    <div class="modal" id="detailsModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="modalTitle">Registrar's Office Class Details</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>

    <script>
        'use strict';

        const tableTpl = `
            <div class="table-responsive">
                <table class="table table-striped" id="overviewsTable" rand="{{rand}}">
                    <thead>
                        <tr>
                            <th>ClassId</th>
                            <th>Dept</th>
                            <th>Num</th>
                            <th>Area</th>
                            <th>Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{#classes}}
                        <tr>
                            <td>
                                <!-- A plain HTML button naturally looks like the reference -->
                                <button onclick="fetchDetails({{classid}})">
                                    {{classid}}
                                </button>
                            </td>
                            <td>{{dept}}</td>
                            <td>{{coursenum}}</td>
                            <td>{{area}}</td>
                            <td>{{title}}</td>
                        </tr>
                        {{/classes}}
                    </tbody>
                </table>
            </div>
        `;

        const detailsTpl = `
            <p><strong>Class Id: </strong>{{classid}}</p>
            <p><strong>Days: </strong>{{days}}</p>
            <p><strong>Start Time: </strong>{{starttime}}</p>
            <p><strong>End Time: </strong>{{endtime}}</p>
            <p><strong>Building: </strong>{{bldg}}</p>
            <p><strong>Room: </strong>{{roomnum}}</p>
            <hr>
            <p><strong>Course Id: </strong>{{courseid}}</p>
            <p><strong>Departments and Numbers: </strong>{{formattedDeptNums}}</p>
            <p><strong>Area: </strong>{{area}}</p>
            <p><strong>Title: </strong>{{title}}</p>
            <p><strong>Description: </strong>{{descrip}}</p>
            <p><strong>Prerequisites: </strong>{{prereqs}}</p>
            <p><strong>Professors: </strong>{{formattedProfs}}</p>
        `;

        let overviewXhr = null;
        let detailsXhr = null;
        let debounceTimer = null;

        function fetchOverviews() {
            const dept = encodeURIComponent(document.getElementById('dept').value);
            const coursenum = encodeURIComponent(document.getElementById('coursenum').value);
            const area = encodeURIComponent(document.getElementById('area').value);
            const title = encodeURIComponent(document.getElementById('title').value);

            const url = '/regoverviews?dept=' + dept + '&coursenum=' + coursenum + '&area=' + area + '&title=' + title;

            if (overviewXhr) {
                overviewXhr.abort();
            }

            overviewXhr = new XMLHttpRequest();
            overviewXhr.open('GET', url);
            
            overviewXhr.onload = function() {
                if (this.status !== 200) {
                    alert('Error: Failed to fetch data from server');
                    return;
                }
                const parsed = JSON.parse(this.responseText);
                if (!parsed[0]) {
                    alert(parsed[1]);
                    return;
                }
                
                const html = Mustache.render(tableTpl, {
                    classes: parsed[1],
                    rand: Math.random().toString()
                });
                document.getElementById('resultsDiv').innerHTML = html;
            };
            
            overviewXhr.onerror = function() {
                alert('Error: Failed to fetch data from server');
            };
            
            overviewXhr.send();
        }

        function fetchDetails(classid) {
            const url = '/regdetails?classid=' + encodeURIComponent(classid);

            if (detailsXhr) {
                detailsXhr.abort();
            }

            detailsXhr = new XMLHttpRequest();
            detailsXhr.open('GET', url);
            
            detailsXhr.onload = function() {
                if (this.status !== 200) {
                    alert('Error: Failed to fetch data from server');
                    return;
                }
                const parsed = JSON.parse(this.responseText);
                if (!parsed[0]) {
                    alert(parsed[1]);
                    return;
                }
                
                const detailsData = parsed[1];
                detailsData.formattedDeptNums = detailsData.deptcoursenums.join(', ');
                detailsData.formattedProfs = detailsData.profnames.join(', ');

                const html = Mustache.render(detailsTpl, detailsData);
                document.getElementById('modalBody').innerHTML = html;
                
                const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
                modal.show();
            };
            
            detailsXhr.onerror = function() {
                alert('Error: Failed to fetch data from server');
            };
            
            detailsXhr.send();
        }

        function onSearchInput() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchOverviews, 500);
        }

        function init() {
            const searchFields = ['dept', 'coursenum', 'area', 'title'];
            searchFields.forEach(function(fieldId) {
                document.getElementById(fieldId).addEventListener('input', onSearchInput);
            });
            
            fetchOverviews();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
